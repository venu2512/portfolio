<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAutoML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31102f" />
    </linearGradient>
    <linearGradient id="stGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#f6851b" />
    </linearGradient>
    <filter id="glowAutoML" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="560" fill="url(#bgGradAutoML)" />

  <!-- Grid background lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M 0 70 L 720 70 M 0 140 L 720 140 M 0 210 L 720 210 M 0 280 L 720 280 M 0 350 L 720 350 M 0 420 L 720 420 M 0 490 L 720 490" />
    <path d="M 90 0 L 90 560 M 180 0 L 180 560 M 270 0 L 270 560 M 360 0 L 360 560 M 450 0 L 450 560 M 540 0 L 540 560 M 630 0 L 630 560" />
  </g>

  <!-- Header Badge -->
  <rect x="40" y="36" width="260" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="58" cy="53" r="5" fill="#ff4b4b" filter="url(#glowAutoML)" />
  <text x="74" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">AUTOML &amp; EDA PIPELINE</text>

  <!-- Badges Top-Right -->
  <g transform="translate(430, 36)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#ff4b4b" fill-opacity="0.2" stroke="#ff4b4b" stroke-opacity="0.4" />
    <text x="55" y="22" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Streamlit</text>
    <rect x="120" y="0" width="130" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="185" y="22" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Scikit-learn</text>
  </g>

  <!-- Pipeline Stepper Flow -->
  <g transform="translate(50, 105)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="135" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="16" y="22" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">01 · DATA</text>
    <text x="16" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CSV &amp; SQL Ingest</text>
    <!-- Arrow -->
    <path d="M 145 26 L 165 26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Stage 2 -->
    <rect x="175" y="0" width="135" height="52" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="191" y="22" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold">02 · EDA</text>
    <text x="191" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Auto Visuals</text>
    <!-- Arrow -->
    <path d="M 320 26 L 340 26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Stage 3 -->
    <rect x="350" y="0" width="135" height="52" rx="10" fill="#1e293b" stroke="#f6851b" stroke-width="1.5" />
    <text x="366" y="22" fill="#fdba74" font-family="monospace" font-size="10" font-weight="bold">03 · ENCODING</text>
    <text x="366" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Impute &amp; Scale</text>
    <!-- Arrow -->
    <path d="M 495 26 L 515 26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Stage 4 -->
    <rect x="525" y="0" width="135" height="52" rx="10" fill="url(#stGrad)" filter="url(#glowAutoML)" />
    <text x="541" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">04 · AUTOML</text>
    <text x="541" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Model Training</text>
  </g>

  <!-- Interactive Dashboard Metrics Section -->
  <g transform="translate(50, 185)">
    <!-- Chart Box Left -->
    <rect width="380" height="280" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Model Comparison Leaderboard</text>
    <text x="24" y="52" fill="#94a3b8" font-family="monospace" font-size="11">Metrics: F1-Score, AUC-ROC, Accuracy</text>

    <!-- Bar 1: XGBoost -->
    <text x="24" y="90" fill="#e2e8f0" font-family="monospace" font-size="12">XGBoost Classifier</text>
    <rect x="24" y="100" width="280" height="20" rx="5" fill="#22c55e" />
    <text x="312" y="115" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">96.8%</text>

    <!-- Bar 2: Random Forest -->
    <text x="24" y="145" fill="#e2e8f0" font-family="monospace" font-size="12">Random Forest</text>
    <rect x="24" y="155" width="265" height="20" rx="5" fill="#38bdf8" />
    <text x="297" y="170" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">94.5%</text>

    <!-- Bar 3: LightGBM -->
    <text x="24" y="200" fill="#e2e8f0" font-family="monospace" font-size="12">LightGBM</text>
    <rect x="24" y="210" width="272" height="20" rx="5" fill="#a855f7" />
    <text x="304" y="225" fill="#a855f7" font-family="monospace" font-size="12" font-weight="bold">95.2%</text>

    <text x="24" y="258" fill="#64748b" font-family="monospace" font-size="10">Automated 5-fold Cross-Validation with Optuna tuning</text>

    <!-- Metric Cards Right -->
    <g transform="translate(400, 0)">
      <!-- Card 1 -->
      <rect width="220" height="85" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">DATA PREPROCESSING</text>
      <text x="18" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="900">0 Missing</text>
      <text x="18" y="72" fill="#64748b" font-family="monospace" font-size="10">Auto-imputed KNN strategy</text>

      <!-- Card 2 -->
      <rect y="98" width="220" height="85" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="126" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PLURLING &amp; PLOTLY</text>
      <text x="18" y="153" fill="#ff4b4b" font-family="system-ui, sans-serif" font-size="22" font-weight="900">12 Charts</text>
      <text x="18" y="170" fill="#64748b" font-family="monospace" font-size="10">Interactive heatmaps &amp; PCA</text>

      <!-- Card 3 -->
      <rect y="195" width="220" height="85" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="223" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MODEL ARTIFACTS</text>
      <text x="18" y="250" fill="#22c55e" font-family="system-ui, sans-serif" font-size="22" font-weight="900">.pkl Export</text>
      <text x="18" y="267" fill="#64748b" font-family="monospace" font-size="10">One-click production weights</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(40, 495)">
    <rect width="640" height="36" rx="8" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="16" y="23" fill="#ff4b4b" font-family="monospace" font-size="12" font-weight="bold">▲ STREAMLIT APP</text>
    <text x="160" y="23" fill="#94a3b8" font-family="monospace" font-size="12">End-to-End Automated EDA · Model Benchmarking · Plotly Visuals</text>
  </g>
</svg>

