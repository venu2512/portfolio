<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glowCloud" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="560" fill="url(#bgGradCloud)" />

  <!-- Ambient light -->
  <circle cx="360" cy="240" r="160" fill="#4338ca" opacity="0.2" filter="url(#glowCloud)" />

  <!-- Header Badge -->
  <rect x="40" y="36" width="270" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="58" cy="53" r="5" fill="#38bdf8" filter="url(#glowCloud)" />
  <text x="74" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">FULL STACK MERN · CLOUD NOVA</text>

  <!-- Deployment Badges Top-Right -->
  <g transform="translate(420, 36)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#f6851b" fill-opacity="0.2" stroke="#f6851b" stroke-opacity="0.4" />
    <text x="55" y="22" fill="#fed7aa" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Vercel UI</text>
    <rect x="120" y="0" width="130" height="34" rx="17" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-opacity="0.4" />
    <text x="185" y="22" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Render API</text>
  </g>

  <!-- Central Architecture Flow -->
  <g transform="translate(50, 110)">
    <!-- Node 1: React Frontend -->
    <rect x="0" y="0" width="180" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="30" cy="30" r="12" fill="#38bdf8" opacity="0.3" />
    <text x="30" y="34" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">UI</text>
    <text x="52" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">React Frontend</text>
    <text x="18" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Vercel Edge CDN</text>

    <!-- Connector 1 -->
    <path d="M 180 45 L 230 45" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" />
    <polygon points="230,45 220,40 220,50" fill="#38bdf8" />

    <!-- Node 2: Express / Node Backend -->
    <rect x="230" y="0" width="180" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="260" cy="30" r="12" fill="#10b981" opacity="0.3" />
    <text x="260" y="34" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">API</text>
    <text x="282" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Node / Express</text>
    <text x="248" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Render Web Service</text>

    <!-- Connector 2 -->
    <path d="M 410 45 L 460 45" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" />
    <polygon points="460,45 450,40 450,50" fill="#10b981" />

    <!-- Node 3: MongoDB Atlas -->
    <rect x="460" y="0" width="160" height="90" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
    <circle cx="490" cy="30" r="12" fill="#22c55e" opacity="0.3" />
    <text x="490" y="34" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">DB</text>
    <text x="512" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">MongoDB</text>
    <text x="478" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Atlas Sharded Cluster</text>
  </g>

  <!-- Live Application Preview Panel -->
  <g transform="translate(50, 230)">
    <rect width="620" height="235" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" />

    <!-- Mock Nav -->
    <rect width="620" height="38" rx="14" fill="#111827" />
    <rect y="26" width="620" height="12" fill="#111827" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="75" y="24" fill="#94a3b8" font-family="monospace" font-size="11">https://cloudnova.app/dashboard</text>

    <!-- Content 2 Columns -->
    <g transform="translate(24, 60)">
      <!-- Left Stats Card -->
      <rect width="260" height="150" rx="10" fill="#1e293b" />
      <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SYSTEM HEALTH</text>
      <text x="18" y="65" fill="#22c55e" font-family="system-ui, sans-serif" font-size="28" font-weight="900">99.98%</text>
      <text x="18" y="88" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Render Deployment Online</text>
      <rect x="18" y="105" width="160" height="24" rx="6" fill="#065f46" stroke="#22c55e" />
      <text x="28" y="121" fill="#6ee7b7" font-family="monospace" font-size="11">HTTP 200 · 42ms Latency</text>

      <!-- Right APIs Card -->
      <g transform="translate(280, 0)">
        <rect width="290" height="150" rx="10" fill="#1e293b" />
        <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">REST API ENDPOINTS</text>

        <rect x="18" y="45" width="254" height="26" rx="6" fill="#0f172a" />
        <text x="26" y="62" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">POST</text>
        <text x="65" y="62" fill="#f8fafc" font-family="monospace" font-size="11">/api/v1/auth/login</text>

        <rect x="18" y="78" width="254" height="26" rx="6" fill="#0f172a" />
        <text x="26" y="95" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">GET</text>
        <text x="65" y="95" fill="#f8fafc" font-family="monospace" font-size="11">/api/v1/workflows</text>

        <rect x="18" y="111" width="254" height="26" rx="6" fill="#0f172a" />
        <text x="26" y="128" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">PUT</text>
        <text x="65" y="128" fill="#f8fafc" font-family="monospace" font-size="11">/api/v1/data/sync</text>
      </g>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(40, 495)">
    <rect width="640" height="36" rx="8" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="16" y="23" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">☁ MERN CLOUD</text>
    <text x="150" y="23" fill="#94a3b8" font-family="monospace" font-size="12">Vercel Frontend · Render Backend · MongoDB Atlas · JWT Auth</text>
  </g>
</svg>

