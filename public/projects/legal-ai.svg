<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLegal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gemmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGavel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glowLegal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="560" fill="url(#bgGradLegal)" />

  <!-- Grid texture -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.05">
    <path d="M 0 70 L 720 70 M 0 140 L 720 140 M 0 210 L 720 210 M 0 280 L 720 280 M 0 350 L 720 350 M 0 420 L 720 420 M 0 490 L 720 490" />
    <path d="M 90 0 L 90 560 M 180 0 L 180 560 M 270 0 L 270 560 M 360 0 L 360 560 M 450 0 L 450 560 M 540 0 L 540 560 M 630 0 L 630 560" />
  </g>

  <!-- Header Badge -->
  <rect x="40" y="36" width="260" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="58" cy="53" r="5" fill="#38bdf8" filter="url(#glowLegal)" />
  <text x="74" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">LEGAL AI ASSISTANT · GEMMA</text>

  <!-- Badges Top-Right -->
  <g transform="translate(430, 36)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="55" y="22" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">QLoRA / SFT</text>
    <rect x="120" y="0" width="130" height="34" rx="17" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.4" />
    <text x="185" y="22" fill="#fde68a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Ollama Deploy</text>
  </g>

  <!-- Central Legal Chat Interface Mock -->
  <g transform="translate(60, 100)">
    <!-- Chat Container -->
    <rect width="600" height="360" rx="14" fill="#0b1329" stroke="#1e293b" stroke-width="2" />

    <!-- Chat Header -->
    <rect width="600" height="48" rx="14" fill="#0f172a" />
    <rect y="36" width="600" height="12" fill="#0f172a" />
    <circle cx="28" cy="24" r="8" fill="url(#goldGavel)" />
    <text x="48" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Lex Legal AI Chatbot</text>
    <rect x="470" y="12" width="105" height="24" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="522" y="28" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Gemma-2B QLoRA</text>

    <!-- User Query Bubble -->
    <g transform="translate(180, 70)">
      <rect width="395" height="48" rx="12" fill="#1e293b" />
      <text x="18" y="22" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Counsel Query:</text>
      <text x="18" y="38" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">What constitutes electronic record proof under Section 65B?</text>
    </g>

    <!-- AI Response Bubble -->
    <g transform="translate(24, 135)">
      <rect width="552" height="195" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <circle cx="26" cy="28" r="10" fill="url(#gemmaGrad)" />
      <text x="44" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Statutory Opinion &amp; Analysis:</text>

      <g transform="translate(24, 55)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
        <text y="0">Under Section 65B(4) of the Indian Evidence Act, any secondary electronic record</text>
        <text y="18">requires an accompanying certificate signed by a person occupying an official</text>
        <text y="36">responsible position in relation to the operation of the device.</text>
      </g>

      <!-- Citation & Confidence Tags -->
      <g transform="translate(24, 130)">
        <rect width="180" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-family="monospace" font-size="11">Sec. 65B(4) Evidence Act</text>

        <rect x="195" y="0" width="160" height="28" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
        <text x="207" y="18" fill="#fbbf24" font-family="monospace" font-size="11">Arjun Panditrao (2020)</text>

        <rect x="370" y="0" width="155" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="382" y="18" fill="#34d399" font-family="monospace" font-size="11">99.4% Low Hallucination</text>
      </g>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(40, 495)">
    <rect width="640" height="36" rx="8" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="16" y="23" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">⚖ DOMAIN LLM</text>
    <text x="145" y="23" fill="#94a3b8" font-family="monospace" font-size="12">Fine-Tuned on Legal Datasets · Low-Resource Inference · Statutory Grounding</text>
  </g>
</svg>

