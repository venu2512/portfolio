<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6851b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="560" fill="url(#bgGrad)" />

  <!-- Grid texture -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M 0 70 L 720 70 M 0 140 L 720 140 M 0 210 L 720 210 M 0 280 L 720 280 M 0 350 L 720 350 M 0 420 L 720 420 M 0 490 L 720 490" />
    <path d="M 90 0 L 90 560 M 180 0 L 180 560 M 270 0 L 270 560 M 360 0 L 360 560 M 450 0 L 450 560 M 540 0 L 540 560 M 630 0 L 630 560" />
  </g>

  <!-- Header Badge -->
  <rect x="40" y="36" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" />
  <circle cx="58" cy="53" r="5" fill="#f6851b" filter="url(#glow)" />
  <text x="74" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">UNIVERSITY OS · 8 AGENTS</text>

  <!-- Technology Badges Top-Right -->
  <g transform="translate(430, 36)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="55" y="22" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LangGraph</text>
    <rect x="120" y="0" width="130" height="34" rx="17" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-opacity="0.4" />
    <text x="185" y="22" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">pgvector RAG</text>
  </g>

  <!-- Network Interconnections -->
  <g stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" opacity="0.45">
    <line x1="360" y1="280" x2="360" y2="120" />
    <line x1="360" y1="280" x2="490" y2="160" />
    <line x1="360" y1="280" x2="520" y2="280" />
    <line x1="360" y1="280" x2="480" y2="400" />
    <line x1="360" y1="280" x2="360" y2="440" />
    <line x1="360" y1="280" x2="240" y2="400" />
    <line x1="360" y1="280" x2="200" y2="280" />
    <line x1="360" y1="280" x2="230" y2="160" />
  </g>

  <!-- Orbital Rings -->
  <ellipse cx="360" cy="280" rx="170" ry="150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 8" />
  <ellipse cx="360" cy="280" rx="90" ry="80" fill="none" stroke="#f6851b" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 8 Satellite Agent Nodes -->
  <!-- 1. Top -->
  <g transform="translate(360, 120)">
    <circle r="32" fill="url(#nodeGrad1)" filter="url(#glow)" />
    <text y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Academic</text>
    <text y="10" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Advisor</text>
  </g>

  <!-- 2. Top-Right -->
  <g transform="translate(490, 160)">
    <circle r="30" fill="url(#nodeGrad2)" filter="url(#glow)" />
    <text y="-4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">RAG Search</text>
    <text y="9" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">pgvector</text>
  </g>

  <!-- 3. Right -->
  <g transform="translate(520, 280)">
    <circle r="32" fill="url(#nodeGrad1)" filter="url(#glow)" />
    <text y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Admin</text>
    <text y="10" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Workflow</text>
  </g>

  <!-- 4. Bottom-Right -->
  <g transform="translate(480, 400)">
    <circle r="30" fill="url(#nodeGrad2)" filter="url(#glow)" />
    <text y="-4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Analytics</text>
    <text y="9" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">XGBoost</text>
  </g>

  <!-- 5. Bottom -->
  <g transform="translate(360, 440)">
    <circle r="32" fill="url(#nodeGrad1)" filter="url(#glow)" />
    <text y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Scheduler</text>
    <text y="10" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Timetable</text>
  </g>

  <!-- 6. Bottom-Left -->
  <g transform="translate(240, 400)">
    <circle r="30" fill="url(#nodeGrad2)" filter="url(#glow)" />
    <text y="-4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Attendance</text>
    <text y="9" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Evaluator</text>
  </g>

  <!-- 7. Left -->
  <g transform="translate(200, 280)">
    <circle r="32" fill="url(#nodeGrad1)" filter="url(#glow)" />
    <text y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Faculty</text>
    <text y="10" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Assistant</text>
  </g>

  <!-- 8. Top-Left -->
  <g transform="translate(230, 160)">
    <circle r="30" fill="url(#nodeGrad2)" filter="url(#glow)" />
    <text y="-4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">QA &amp; Audit</text>
    <text y="9" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Compliance</text>
  </g>

  <!-- Center Core: University Coordinator Hub -->
  <g transform="translate(360, 280)">
    <circle r="52" fill="url(#coreGrad)" filter="url(#glow)" />
    <circle r="42" fill="#0f172a" stroke="#f6851b" stroke-width="2.5" />
    <text y="-6" fill="#f6851b" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">AI CORE</text>
    <text y="12" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">HUB</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(40, 495)">
    <rect width="640" height="36" rx="8" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="16" y="23" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">● LIVE</text>
    <text x="75" y="23" fill="#94a3b8" font-family="monospace" font-size="12">FastAPI Microservices · Docker Containers · PostgreSQL pgvector Ready</text>
  </g>
</svg>

